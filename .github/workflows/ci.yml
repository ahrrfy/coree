name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace unit & integration tests
        run: cargo test --workspace --all-targets

      - name: Run workspace doc tests
        run: cargo test --workspace --doc

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Brand & MIME allowlist sweep (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/brand_sweep.py

      - name: Brand & MIME allowlist sweep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/brand_sweep.py
          if ($LASTEXITCODE -ne 0) { throw "brand_sweep.py failed" }

      - name: Verify repository invariants (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/verify_invariants.py --strict-no-std-net

      - name: Verify repository invariants (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/verify_invariants.py --strict-no-std-net
          if ($LASTEXITCODE -ne 0) { throw "verify_invariants.py failed" }

      - name: Check & run offline fuzz targets (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo check --offline --locked --manifest-path fuzz/Cargo.toml
          for bin in fuzz_cdr fuzz_pdf fuzz_svg fuzz_eps fuzz_psd fuzz_icc; do
            cargo run --offline --locked --manifest-path fuzz/Cargo.toml --bin "$bin" -- --iters 50
          done

      - name: Check & run offline fuzz targets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo check --offline --locked --manifest-path fuzz/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "fuzz cargo check failed" }
          foreach ($bin in @("fuzz_cdr", "fuzz_pdf", "fuzz_svg", "fuzz_eps", "fuzz_psd", "fuzz_icc")) {
            cargo run --offline --locked --manifest-path fuzz/Cargo.toml --bin $bin -- --iters 50
            if ($LASTEXITCODE -ne 0) { throw "fuzz target $bin failed" }
          }

      - name: Build & run offline release benchmarks
        run: |
          cargo bench --offline --locked --no-run
          cargo bench --offline --locked --bench autosave_latency -- --iters 20
          cargo bench --offline --locked --bench studio_startup_and_drag -- --iters 30
          cargo bench --offline --locked --bench scene10k_and_raster_cow -- --iters 60

      - name: Build release binary
        run: cargo build --release --package coree-app --bins

      - name: Smoke test release binary & packaging metadata (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          ./target/release/coree --diagnostics | tee /tmp/coree-diag.txt
          grep -q "coree v${EXPECTED_VER}" /tmp/coree-diag.txt
          ./target/release/coree-cli --diagnostics | tee /tmp/coree-cli-diag.txt
          grep -q "coree v${EXPECTED_VER}" /tmp/coree-cli-diag.txt
          bash -n packaging/linux/install-linux.sh packaging/linux/build-deb.sh packaging/linux/build-appimage.sh
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in (
              "packaging/linux/coree-mime.xml",
              "packaging/linux/flatpak/io.github.ahrrfy.coree.metainfo.xml",
              "packaging/windows/wix/main.wxs",
              "packaging/windows/coree.exe.manifest",
          ):
              ET.parse(path)
          print("All Linux & Windows XML manifests parsed cleanly.")
          PY
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate packaging/linux/coree.desktop
          fi

      - name: Smoke test release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedVer = (Select-String -Path "Cargo.toml" -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Copy-Item ".\target\release\coree-cli.exe" ".\target\release\coree.com" -Force
          $cliOut = & .\target\release\coree.com --diagnostics
          if ($LASTEXITCODE -ne 0) { throw "coree.com --diagnostics failed with exit code $LASTEXITCODE" }
          if (($cliOut -join "`n") -notmatch "coree v$([regex]::Escape($expectedVer))") { throw "coree.com --diagnostics missing coree v$expectedVer" }
          $guiProc = Start-Process -FilePath ".\target\release\coree.exe" -ArgumentList "--diagnostics" -NoNewWindow -Wait -PassThru
          if ($guiProc.ExitCode -ne 0) { throw "coree.exe GUI launcher exited with code $($guiProc.ExitCode)" }
