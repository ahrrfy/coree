[workspace]
resolver = "2"
members = [
    "crates/coree-core",
    "crates/coree-tools",
    "crates/coree-cdr",
    "crates/coree-io",
    "crates/coree-storage",
    "crates/coree-render",
    "crates/coree-prod",
    "crates/coree-app",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ahrrfy/coree"
authors = ["coree contributors"]

[workspace.dependencies]
# Internal crates
coree-core = { path = "crates/coree-core" }
coree-tools = { path = "crates/coree-tools" }
coree-cdr = { path = "crates/coree-cdr" }
coree-io = { path = "crates/coree-io" }
coree-storage = { path = "crates/coree-storage" }
coree-render = { path = "crates/coree-render" }
coree-prod = { path = "crates/coree-prod" }

# Desktop UI & native dialogs (pure-Rust / dlopen on Linux, zero -dev C headers)
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "persistence"] }
egui = "0.37"
egui_dock = { version = "0.22", features = ["serde"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
wl-clipboard-rs = "0.9.5"
x11rb = "0.14.0"

# Local storage
rusqlite = { version = "0.43", features = ["bundled"] }

# Geometry, vector, text, spatial indexing & rendering
tiny-skia = "0.12"
kurbo = "0.13"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "wgsl", "noop"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.3"
i_overlay = "9.2"
cosmic-text = "0.19"
rstar = "0.14"
usvg = "0.50"
resvg = "0.50"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp"] }

# Archives, compression & binary codecs
zip = { version = "9.8", default-features = false, features = ["deflate"] }
flate2 = "1.1"
byteorder = "1.5"
encoding_rs = "0.8"
fax = "0.2.7"
ttf-parser = "0.25.1"
weezl = "0.1.12"

# Serialization, concurrency, scripting & utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.41"
rayon = "1.12"
rhai = "1.27"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
tempfile = "3.27"
qrcode = "0.15"

[package]
name = "coree-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "coree_bench_common"
path = "benches/common/mod.rs"
test = false
doctest = false
bench = false

[dev-dependencies]
coree-app = { path = "crates/coree-app" }
coree-core.workspace = true
coree-render.workspace = true
coree-storage.workspace = true
coree-tools.workspace = true
egui.workspace = true
tempfile.workspace = true

[[bench]]
name = "studio_startup_and_drag"
path = "benches/studio_startup_and_drag.rs"
harness = false

[[bench]]
name = "autosave_latency"
path = "benches/autosave_latency.rs"
harness = false

[[bench]]
name = "scene10k_and_raster_cow"
path = "benches/scene10k_and_raster_cow.rs"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
