<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="coree vector studio icon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191c24"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="cobaltArc" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#6bc0ff"/>
      <stop offset="55%" stop-color="#3ea6ff"/>
      <stop offset="100%" stop-color="#1d78d8"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f6ad3c"/>
    </linearGradient>
  </defs>

  <!-- Neutral Graphite Studio Badge -->
  <rect x="12" y="12" width="232" height="232" rx="48" ry="48" fill="url(#bgGrad)" stroke="#2e3445" stroke-width="6"/>

  <!-- Subtle Geometric Drafting Grid Accent -->
  <g stroke="#232734" stroke-width="2" fill="none" opacity="0.9">
    <line x1="64" y1="28" x2="64" y2="228"/>
    <line x1="128" y1="28" x2="128" y2="228"/>
    <line x1="192" y1="28" x2="192" y2="228"/>
    <line x1="28" y1="64" x2="228" y2="64"/>
    <line x1="28" y1="128" x2="228" y2="128"/>
    <line x1="28" y1="192" x2="228" y2="192"/>
  </g>

  <!-- Bezier Tangent Handle Lines -->
  <g stroke="#f6ad3c" stroke-width="4" stroke-linecap="round" opacity="0.88">
    <line x1="178" y1="78" x2="206" y2="50"/>
    <line x1="178" y1="178" x2="206" y2="206"/>
  </g>

  <!-- Primary Electric Cobalt Geometric C-Arc -->
  <path d="M 178 78 A 70 70 0 1 0 178 178" fill="none" stroke="url(#cobaltArc)" stroke-width="26" stroke-linecap="round"/>

  <!-- Inner Precision Pen-Nib / Studio Reticle Diamond -->
  <polygon points="154,104 178,128 154,152 130,128" fill="url(#amberAccent)"/>
  <circle cx="154" cy="128" r="7" fill="#111318"/>

  <!-- Vector Anchor Nodes (Square) & Bezier Control Handles (Circles) -->
  <rect x="169" y="69" width="18" height="18" rx="3" fill="#f1f4f9" stroke="#111318" stroke-width="4"/>
  <rect x="169" y="169" width="18" height="18" rx="3" fill="#f1f4f9" stroke="#111318" stroke-width="4"/>
  <rect x="49" y="119" width="18" height="18" rx="3" fill="#f1f4f9" stroke="#111318" stroke-width="4"/>

  <circle cx="206" cy="50" r="8" fill="#f6ad3c" stroke="#111318" stroke-width="3"/>
  <circle cx="206" cy="206" r="8" fill="#f6ad3c" stroke="#111318" stroke-width="3"/>
</svg>
