[package]
name = "coree-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native cross-platform desktop UI binary for coree."

[[bin]]
name = "coree"
path = "src/main.rs"

[[bin]]
name = "coree-cli"
path = "src/bin/coree_cli.rs"

[dependencies]
arboard.workspace = true
chrono.workspace = true
clap.workspace = true
coree-cdr.workspace = true
coree-core.workspace = true
coree-io.workspace = true
coree-prod.workspace = true
coree-render.workspace = true
coree-storage.workspace = true
coree-tools.workspace = true
dirs.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-bidi = "0.3.18"
uuid.workspace = true

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "emscripten"))))'.dependencies]
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wl-clipboard-rs.workspace = true
x11rb.workspace = true

[dev-dependencies]
tempfile.workspace = true
